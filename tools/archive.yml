name: Rebuild archive

# Parse the logs and regenerate the figures whenever new logs are pushed,
# so nothing has to be run locally.

on:
  push:
    paths:
      - 'logs/**'
      - 'tools/**'
      - '.github/workflows/archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet matplotlib numpy bokeh

      - name: Parse logs
        run: python tools/parse_logs.py

      - name: Make plots
        run: python tools/make_plots.py

      # ~5 MB and regenerated every run, so it is downloaded from here
      # rather than committed. GitHub cannot render it in the repo anyway.
      - name: Upload interactive plot
        uses: actions/upload-artifact@v4
        with:
          name: interactive-plot
          path: plots/interactive.html
          retention-days: 90

      - name: Commit regenerated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tandh.csv events.csv plots/*.png
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Rebuild archive: CSVs and plots [skip ci]"
            git push
          fi
