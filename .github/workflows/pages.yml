name: Build and publish site

# Parse the logs, regenerate the figures, build the MkDocs site and publish it.
# Nothing is committed back to main, so pushing here never conflicts with a
# build - which the earlier commit-back workflow did.

on:
  push:
    branches: [main]
    paths:
      - 'logs/**'
      - 'tools/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write        # gh-deploy pushes to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gh-deploy needs the gh-pages history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements-docs.txt

      - name: Parse logs
        run: python tools/parse_logs.py

      - name: Make plots
        run: python tools/make_plots.py

      - name: Stage figures into the site
        run: |
          mkdir -p docs/plots
          cp plots/*.png docs/plots/
          cp plots/interactive.html docs/plots/ 2>/dev/null || true
          ls -la docs/plots/

      - name: Upload the CSVs, so the parsed data is downloadable
        uses: actions/upload-artifact@v4
        with:
          name: parsed-data
          path: |
            tandh.csv
            events.csv
          retention-days: 90

      - name: Publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
